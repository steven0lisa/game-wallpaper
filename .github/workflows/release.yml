name: Release

# Versioning: git tag v{major}.{minor} (e.g. v1.0) is a release; each tag maps 1:1
# to a Release. Pushing a tag -> universal build -> dmg (bundled maps decrypted
# from a secret; sprite assets stay bring-your-own) -> auto-generated notes -> GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-dmg:
    name: Build dmg & publish release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gen_release_notes / rev-list need full history

      - name: Validate tag format (v{major}.{minor})
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag: $TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: tag must be v{major}.{minor} (e.g. v1.0); got: $TAG" >&2
            exit 1
          }

      - name: Build universal app + dmg (bundled maps decrypted from secret)
        run: REQUIRE_ASSETS=0 ./scripts/build_app.sh
        env:
          MARKETING_VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ref-${{ github.ref_name }}
          # Password for the encrypted bundled-map copies (without it the build degrades to a mapless package)
          BUNDLED_MAPS_PASS: ${{ secrets.BUNDLED_MAPS_PASS }}

      - name: Generate release notes
        run: |
          chmod +x scripts/gen_release_notes.sh
          scripts/gen_release_notes.sh "${GITHUB_REF_NAME}" > build/release-notes.md
          cat build/release-notes.md

      - name: Upload dmg to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/release-notes.md
          files: build/GameWallpaper.dmg
          fail_on_unmatched_files: true
